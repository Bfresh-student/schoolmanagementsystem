<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CEJEC ERP · Démarrage...</title>
    <meta name="theme-color" content="#0A4D8C">
    <link rel="manifest" href="manifest.json">
    <script src="sw-register.js" defer></script>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="assets/favicon.png" sizes="50x50" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue:#0A4D8C;
            --blue-dark:#073864;
            --blue-darker:#052440;
            --blue-light:#e8f1fa;
            --success:#10b981;
            --warning:#f59e0b;
            --red:#D62828;
            --purple:#8b5cf6;
            --ink:#1a1f2b;
            --muted:#5b6675;
            --white:#ffffff;
        }

        *{margin:0;padding:0;box-sizing:border-box}

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #052440 0%, #073864 30%, #0A4D8C 60%, #0d5ca0 100%);
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Particules background */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: particleFloat 8s ease-in-out infinite;
        }
        .particle:nth-child(1){left:10%;top:20%;animation-delay:0s}
        .particle:nth-child(2){left:25%;top:60%;animation-delay:1s}
        .particle:nth-child(3){left:40%;top:30%;animation-delay:2s}
        .particle:nth-child(4){left:55%;top:70%;animation-delay:3s}
        .particle:nth-child(5){left:70%;top:40%;animation-delay:4s}
        .particle:nth-child(6){left:85%;top:15%;animation-delay:5s}
        .particle:nth-child(7){left:15%;top:80%;animation-delay:6s}
        .particle:nth-child(8){left:50%;top:10%;animation-delay:7s}
        .particle:nth-child(9){left:75%;top:55%;animation-delay:2.5s}
        .particle:nth-child(10){left:35%;top:45%;animation-delay:5.5s}
        .particle:nth-child(11){left:90%;top:75%;animation-delay:3.5s}
        .particle:nth-child(12){left:5%;top:50%;animation-delay:1.5s}

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            25% { transform: translateY(-30px) translateX(15px) scale(1.5); opacity: 0.6; }
            50% { transform: translateY(-15px) translateX(-10px) scale(1); opacity: 0.3; }
            75% { transform: translateY(-40px) translateX(-15px) scale(2); opacity: 0.7; }
        }

        /* Wonn flou background */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .bg-orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--success) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation: orbFloat 12s ease-in-out infinite;
        }
        .bg-orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--purple) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            animation: orbFloat 10s ease-in-out infinite reverse;
        }
        .bg-orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--warning) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbPulse 6s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        @keyframes orbPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.25; }
        }

        /* Kontni prensipal */
        .loader-container {
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Logo */
        .logo-wrapper {
            position: relative;
            animation: logoFloat 3s ease-in-out infinite;
        }
        .logo-icon {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 27px;
            z-index: -1;
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .logo-ring {
            position: absolute;
            inset: -15px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            animation: ringPulse 3s ease-in-out infinite;
        }
        .logo-ring:nth-child(2) {
            inset: -30px;
            animation-delay: 0.5s;
            border-color: rgba(255,255,255,0.08);
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Non mak */
        .brand-name {
            margin-top: 20px;
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Playfair Display', Georgia, serif;
            color: var(--white);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .brand-subtitle {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: -12px;
        }

        /* Tagline */
        .tagline {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Progress bar */
        .progress-wrapper {
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .progress-outer {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #34d399, var(--warning), var(--purple));
            background-size: 200% 100%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(16,185,129,0.4);
            animation: progressLoad 2.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards,
                       progressShine 1.5s ease-in-out infinite;
            width: 0%;
        }
        @keyframes progressLoad {
            0% { width: 0%; }
            30% { width: 45%; }
            60% { width: 78%; }
            85% { width: 92%; }
            100% { width: 100%; }
        }
        @keyframes progressShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .progress-text {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            animation: textFade 1.5s ease-in-out infinite;
        }
        @keyframes textFade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Footer */
        .footer-credit {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 2;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            font-weight: 400;
            line-height: 1.6;
        }
        .footer-credit .from {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
        }
        .footer-credit .dev-name {
            font-weight: 800;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #667eea, #764ba2);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 4s ease-in-out infinite;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Loading dots */
        .loading-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 4px;
        }
        .loading-dot {
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        /* Responsive */
        @media(max-width:600px) {
            .logo-icon {
                width: 85px;
                height: 85px;
                border-radius: 20px;
            }
            .logo-icon::after {
                border-radius: 23px;
            }
            .logo-icon img {
                width: 100%;
                height: 100%;
            }
            .brand-name { font-size: 1.4rem; letter-spacing: 2px; }
            .progress-wrapper { width: 220px; }
            .tagline { font-size: 0.7rem; }
        }
        
    </style>
</head>
<body>

    <!-- Particules background -->
    <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <!-- Wonn flou -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Kontni prensipal -->
    <div class="loader-container">
        <!-- Logo ak bag -->
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-icon">
                <img src="assets/favicon.png" alt="cejec logo">
            </div>
        </div>

        <!-- Non mak -->
        <div class="brand-name">CEJEC</div>
        <div class="brand-subtitle">Centre d'Études des Jeunes en Entrepreneuriat et Commerce</div>

        <!-- Tagline -->
        <div class="tagline">
            <i class="fas fa-graduation-cap" style="margin-right:6px;opacity:0.7"></i>
            Entrepreneuriat · Leadership · Innovation
        </div>

        <!-- Progress bar -->
        <div class="progress-wrapper">
            <div class="progress-outer">
                <div class="progress-inner"></div>
            </div>
            <div class="progress-text">Chargement en cours</div>
            <div class="loading-dots">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-credit">
        <span class="from">Développé par</span><br>
        <span class="dev-name">Qytralab</span>
    </div>

    <!-- Script redireksyon -->
    <script>
        // Redireksyon apre animasyon fini
        setTimeout(() => {
            // Efè fade out
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.6s ease';
            
            setTimeout(() => {
                if (localStorage.getItem("authToken")) {
                    window.location.href = "Dashbord-Admin.html";
                } else {
                    window.location.href = "Se connecter - Admin.html";
                }
            }, 600);
        }, 3200);
    </script>
<script src="js/user-profile.js"></script>
</body>
</html>
